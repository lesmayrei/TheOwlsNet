<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login – The Owls Net</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: system-ui, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #1e293b;
            padding: 2rem 2.5rem;
            border-radius: 12px;
            width: 360px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 1.6rem;
        }
        label {
            display: block;
            margin-bottom: 0.3rem;
            color: #cbd5e1;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 0.65rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border: 1px solid #475569;
            background: #0f172a;
            color: #f8fafc;
        }
        input:focus {
            border-color: #38bdf8;
            outline: none;
        }
        .btn {
            width: 100%;
            padding: 0.7rem;
            border-radius: 8px;
            background: #38bdf8;
            border: none;
            color: #0f172a;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .btn:hover {
            background: #0ea5e9;
        }
        .switch {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
        }
        .switch a {
            color: #38bdf8;
            text-decoration: none;
        }
        .switch a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Login</h1>

        <form action="#" method="POST">
            <!-- We will change action="#" → "login.php" later -->

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="yourname@southernct.edu" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>

            <button class="btn" type="submit">Log In</button>
        </form>

        <div class="switch">
            Don’t have an account? <a href="register.html">Register</a>
        </div>
    </div>

</body>
</html>
